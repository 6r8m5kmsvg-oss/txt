<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A8C">
<title>Dia de Gabriel e Jordane ficarem de novo ❤️</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:wght@500;600&display=swap">
<style>
:root {
  --bg: #0E1A8C;
  --fill: #2A44FF;
  --ink: #F4F2FF;
  --dim: #A9B2FF;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0A1370; --fill: #2238E6; } }
:root[data-theme="dark"] { --bg: #0A1370; --fill: #2238E6; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Figtree", system-ui, sans-serif;
  overflow: hidden;
}
.fill {
  position: fixed; left: 0; right: 0; bottom: 0;
  height: 0%; background: var(--fill);
  transition: height 1s linear;
  z-index: 0;
}
main {
  position: relative; z-index: 1;
  height: 100%;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 28px 24px 24px;
}
h1 { font-size: 1.05rem; font-weight: 600; color: var(--dim); line-height: 1.35; max-width: 22ch; }
.units { display: flex; flex-direction: column; flex: 1; justify-content: center; }
.row {
  display: flex; align-items: baseline; justify-content: space-between;
  border-bottom: 2px solid rgba(244,242,255,.22);
  padding: 2px 0;
}
.row:last-child { border-bottom: 0; }
.num {
  font-family: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
  font-weight: 900;
  font-size: clamp(88px, 21vh, 190px);
  line-height: .92;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
.lab { font-size: 1.05rem; font-weight: 600; color: var(--dim); }
footer { font-size: .95rem; color: var(--dim); }
</style>
</head>
<body>
<div class="fill" id="fill"></div>
<main>
  <h1 id="title">Dia de Gabriel e Jordane ficarem de novo ❤️</h1>
  <div class="units" id="units">
    <div class="row"><span class="num" id="d">00</span><span class="lab">dias</span></div>
    <div class="row"><span class="num" id="h">00</span><span class="lab">horas</span></div>
    <div class="row"><span class="num" id="m">00</span><span class="lab">minutos</span></div>
    <div class="row"><span class="num" id="s">00</span><span class="lab">segundos</span></div>
  </div>
  <footer id="foot">Contagem iniciada em 6 de outubro</footer>
</main>
<script>
(function () {
  var target = new Date(2026, 9, 24, 0, 0, 0).getTime();
  var start = new Date(2026, 9, 6, 0, 0, 0).getTime();
  var $ = function (id) { return document.getElementById(id); };
  var p = function (n) { return String(n).padStart(2, "0"); };
  function tick() {
    var now = Date.now();
    var left = target - now;
    if (left <= 0) {
      $("title").textContent = "Chegou o dia de Gabriel e Jordane ficarem de novo ❤️";
      $("units").innerHTML = '<div class="row"><span class="num">00</span><span class="lab">hoje é o dia</span></div>';
      $("fill").style.height = "100%";
      $("foot").textContent = "";
      return;
    }
    var t = Math.floor(left / 1000);
    $("d").textContent = p(Math.floor(t / 86400));
    $("h").textContent = p(Math.floor(t % 86400 / 3600));
    $("m").textContent = p(Math.floor(t % 3600 / 60));
    $("s").textContent = p(t % 60);
    var pct = Math.min(100, Math.max(0, (now - start) / (target - start) * 100));
    $("fill").style.height = pct + "%";
    setTimeout(tick, 1000 - (now % 1000));
  }
  tick();
})();
</script>
</body>
</html>
